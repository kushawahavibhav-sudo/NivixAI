<script type="module">

W.__signInGithub=()=>signInWithPopup(auth,ghp);

// ID token sent to /api/* so the server can verify who is calling (verify it server-side with the Firebase Admin SDK)
W.__token=async()=>auth.currentUser?auth.currentUser.getIdToken():null;

// ---- chat sync ----
const seen={},MAX_DOC=800000; // Firestore docs are capped at 1 MB
const keyOf=(uid,c)=>uid+":"+c.id+":"+(c.updated||0)+":"+c.messages.length;
const fit=m=>{let r=m;while(r.length>2&&JSON.stringify(r).length>MAX_DOC)r=r.slice(1);return r};
W.__saveChats=async(uid,chats)=>{
 for(const c of chats){const k=keyOf(uid,c);if(seen[k])continue;
  try{
   const messages=fit(c.messages.filter(m=>!m.err).map(m=>m.image&&String(m.image).startsWith("data:")?{...m,image:null}:m));
   await setDoc(doc(db,"users",uid,"chats",String(c.id)),JSON.parse(JSON.stringify({...c,messages})));
   seen[k]=1;
  }catch(e){console.error("Save failed",c.id,e)}}};
W.__loadChats=async uid=>{
 const snap=await getDocs(collection(db,"users",uid,"chats"));
 const out=snap.docs.map(d=>d.data()).filter(c=>c&&c.id&&Array.isArray(c.messages));
 out.forEach(c=>{seen[keyOf(uid,c)]=1}); // already in the cloud, don't write them back
 return out.sort((a,b)=>(b.updated||b.id)-(a.updated||a.id))};

W.__pushRoom=(id,messages,by)=>setDoc(doc(db,"rooms",id),JSON.parse(JSON.stringify({messages:fit(messages.filter(m=>!m.err).map(m=>m.image&&String(m.image).startsWith("data:")?{...m,image:null}:m)),by,updated:Date.now()})));

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ac:#7c6af7;--ac2:#c084fc;--acr:124,106,247;--ac2r:192,132,252;
  --tr:10,12,28;--tx:#f0f1ff;--sub:#9a9fc4;--nt:#d4d7f5;
  --panel:rgba(16,18,40,.62);--card2:rgba(18,20,44,.55);--ibg:rgba(14,16,36,.72);

body{font-family:Inter,-apple-system,'Segoe UI',sans-serif;background:var(--abg);color:var(--tx);-webkit-font-smoothing:antialiased}
#root{height:100dvh}

.app{height:100dvh;display:flex;flex-direction:column;gap:12px;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:calc(12px + env(safe-area-inset-top,0px));background:var(--abg);position:relative;z-index:1;transition:background .6s}

}

.top,.card,.center,.promo,.quote,.mc,.ibox,.btn,.ib,.send,.off,.opt,.chip,.nav button,.bub{

  const cleanT=t.trim().replace(/[.?]+$/,"");
  if(rnd===0){
   return pro
    ? `The motion "${cleanT}" must be resolutely adopted. Empirical research and operational realities confirm that this direction systematically reduces friction, enhances productivity, and delivers compounding long-term benefits while effectively managing risks.`

  }else if(rnd===1){
   return pro
    ? `The opposition mischaracterizes the core mechanism. Every transformative evolution historically encountered initial skepticism. Adaptive protocols and structured implementation directly neutralize the opposition's concerns while unlocking crucial value.`
    : `The affirmative's supposed guardrails fail under real-world pressure. Theoretical assurances cannot substitute for proven stability, and gambling existing strengths on untested assumptions is an unacceptable liability.`;
  }else{
   return pro
    ? `In summary, the affirmative has proven that "${cleanT}" is both necessary and viable. The risks cited by the opposition are manageable trade-offs, whereas inaction guarantees obsolescence and missed opportunity.`

 const call=async(system,user,max,proFlag,rndNum)=>{

    setRound(rnd+1);

    const t=await call(

  }

    const m=raw.match(/\{[\s\S]*?\}/);

    j={pro:proWins?8:7,con:proWins?6:8,winner:proWins?"pro":"con",why:"Both sides argued rigorously with balanced points on evidence and rebuttal."};
   }
   if(!["pro","con","tie"].includes(j.winner))j.winner=j.pro>j.con?"pro":j.con>j.pro?"con":"tie";
