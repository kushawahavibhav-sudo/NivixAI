<!-- NivixAI redesign: paste this whole block right before </head> (after your existing </style>) -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* NivixAI redesign: editorial serif + aurora glass + bento layout that fills every gap.
   Load AFTER the inline <style> so it wins. All features/logic stay untouched. */
:root{--serif:'Fraunces',Georgia,'Times New Roman',serif}
body{font-family:Inter,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
[data-theme=hacker] body{font-family:'Courier New',Courier,monospace}

/* aurora backdrop (only when no wallpaper / matrix is active) */
.app:not(.fx){gap:14px;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));
 background:
  radial-gradient(55% 45% at 12% -5%,rgba(var(--acr),.34),transparent 70%),
  radial-gradient(45% 40% at 100% 15%,rgba(var(--ac2r),.26),transparent 70%),
  radial-gradient(55% 45% at 55% 112%,rgba(245,201,122,.14),transparent 70%),var(--abg)}
.fx.app{gap:14px;padding:14px}
.main{gap:14px;grid-template-columns:250px 1fr 310px}
@media(max-width:1100px){.main{grid-template-columns:250px 1fr}}
@media(max-width:768px){.main{grid-template-columns:1fr}.app:not(.fx),.fx.app{padding:10px;gap:10px}}

/* top bar */
.top{padding:10px 20px;border-radius:22px}
.brand{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:-.02em;
 background:linear-gradient(100deg,var(--tx) 35%,var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
[data-theme=hacker] .brand{-webkit-text-fill-color:currentColor;background:none}
.tag{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.pill{background:rgba(34,229,143,.12);color:#7be8b5;border:1px solid rgba(34,229,143,.25)}

/* sidebar */
.nav{padding:8px;border-radius:22px;border:1px solid var(--line);background:var(--panel);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%)}
.nav button{padding:14px 16px;border-radius:14px;font-weight:500}
.nav button.on{background:linear-gradient(90deg,rgba(var(--acr),.38),rgba(var(--ac2r),.12));border-color:rgba(var(--acr),.45)}
.promo{border-radius:22px;min-height:240px;padding:24px 20px;font-family:var(--serif);font-size:23px;line-height:1.2;font-weight:500;letter-spacing:-.01em}
.promo::after{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,rgba(5,6,15,.55),transparent 45%);pointer-events:none}
.promo span{z-index:1}

/* centre stage */
.center{border-radius:28px}
.center::before{content:"";position:absolute;left:10%;right:10%;top:-60px;height:140px;background:radial-gradient(closest-side,rgba(var(--ac2r),.35),transparent);pointer-events:none;filter:blur(20px)}
.scroll{padding:30px 30px 18px}
.hero.enter{max-width:none;margin:0;flex:1;justify-content:space-between;gap:28px;padding:4px 0 6px}
.hero h1{font-family:var(--serif);font-size:clamp(34px,4.8vw,62px);font-weight:500;letter-spacing:-.03em;line-height:1.04;
 background:linear-gradient(95deg,var(--tx) 45%,var(--ac2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
[data-theme=hacker] .hero h1{-webkit-text-fill-color:currentColor;background:none}
.hero p{font-size:clamp(16px,1.8vw,20px);margin-top:10px}

/* mode cards stretch to fill all remaining height */
.modes{flex:1;grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(120px,1fr);gap:14px}
.mc{position:relative;overflow:hidden;padding:20px;border-radius:24px;gap:4px;
 background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.015)),var(--card2)}
.mc::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
 background:radial-gradient(circle,rgba(var(--acr),.4),transparent 70%);opacity:.55;transition:opacity .4s,transform .5s var(--e);pointer-events:none}
.mc:hover::after,.mc.on::after{opacity:1;transform:scale(1.35)}
.mc span{margin-bottom:auto;width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;
 background:rgba(var(--ac2r),.16);border:1px solid rgba(var(--ac2r),.35)}
.mc b{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.01em}
.mc small{font-size:12.5px}
@media(max-width:768px){.modes{grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(104px,1fr)}.scroll{padding:16px 12px}.mc b{font-size:20px}}

/* input */
.inwrap{padding:0 30px 10px}
.ibox{border-radius:26px;padding:14px 18px;max-width:none}
.ibox .t{font-size:16px;padding:8px 4px}
.send{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.send:hover{background:linear-gradient(135deg,var(--ac2),var(--ac))}
.chip{padding:8px 14px;border-radius:20px;font-size:12.5px}
.foot{padding:2px 0 12px}
@media(max-width:768px){.inwrap{padding:0 12px 6px}}

/* messages */
.msgs{max-width:860px;gap:18px}
.msg{max-width:88%}
.bub{padding:14px 18px;border-radius:22px;font-size:15px;line-height:1.65}
.u .bub{background:linear-gradient(135deg,rgba(var(--acr),.55),rgba(var(--ac2r),.38));border-color:rgba(255,255,255,.2)}
.a .bub{background:var(--card2)}
[data-theme=hacker] .u .bub{background:transparent}

/* right column: every card grows, no dead space */
.right .card{border-radius:22px;padding:20px}
.right>.card:nth-child(2){flex:1;display:flex;flex-direction:column}
.right>.card:nth-child(2)>div:last-child{margin:auto}
.h3{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:-.01em}
.row{padding:12px 0}
.quote{border-radius:22px;flex:1;min-height:170px;padding:26px 22px;font-family:var(--serif);font-size:25px;font-weight:500;line-height:1.3;letter-spacing:-.01em}
.quote::before{content:"\201C";position:absolute;right:14px;top:-18px;font-size:130px;line-height:1;opacity:.14;color:var(--ac2)}

/* modals */
.modal{border-radius:28px;padding:24px}
.mh{font-family:var(--serif);font-size:22px;font-weight:600}
.btn{border-radius:14px;padding:13px}
</style>
