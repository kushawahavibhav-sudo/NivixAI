<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,signInWithPopup,GoogleAuthProvider,GithubAuthProvider,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,setDoc,getDocs,collection}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyCnavvxwXRc7ewTNIiFYx_YPdFwxJTBlEc",authDomain:"nixlai.firebaseapp.com",projectId:"nixlai",storageBucket:"nixlai.firebasestorage.app",messagingSenderId:"414717106260",appId:"1:414717106260:web:45d28637e1a86ecdb8f5c1",measurementId:"G-N0JPWW2RCT"});
const auth=getAuth(app),db=getFirestore(app),gp=new GoogleAuthProvider(),ghp=new GithubAuthProvider();

W.__signOut=()=>signOut(auth);W.__onAuth=cb=>onAuthStateChanged(auth,cb);
// saves only chats changed since last save
const seen={};
W.__saveChats=async(uid,chats)=>{for(const c of chats){const k=c.id+":"+(c.updated||0)+":"+c.messages.length;if(seen[k])continue;
try{const messages=c.messages.map(m=>m.image&&m.image.startsWith("data:")?{...m,image:null}:m);

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ac:#6366f1;--ac2:#a855f7;--acr:99,102,241;--ac2r:168,85,247;--tr:11,13,34;--tx:#eceeff;--sub:#8b90b8;--nt:#cdd0f5;
--panel:rgba(var(--tr),.6);--card2:rgba(var(--tr),.55);--ibg:rgba(var(--tr),.72);--modal:rgb(var(--tr));--line:rgba(var(--acr),.28);
--abg:radial-gradient(900px 500px at 70% -10%,rgba(var(--ac2r),.22),transparent),#04050d;
--cbg:radial-gradient(circle at 82% 8%,rgba(var(--acr),.4) 0,rgba(var(--ac2r),.18) 60px,transparent 140px),linear-gradient(180deg,rgb(var(--tr)),#04050d 75%);
--e:cubic-bezier(.2,.8,.2,1)}
[data-theme=light]{--tx:#14162e;--sub:#5b6088;--nt:#2c3060;--tr:238,240,255;--panel:rgba(255,255,255,.7);--card2:rgba(255,255,255,.85);--ibg:rgba(255,255,255,.9);--modal:#fff;--abg:#eef0fb;--cbg:linear-gradient(180deg,#f7f8ff,#e8ebfb)}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;inset:0}
body{font-family:Inter,-apple-system,'Segoe UI',sans-serif;background:#04050d;color:var(--tx)}
#root{height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font:inherit;color:inherit}:focus{outline:none}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(var(--acr),.35);border-radius:4px}
#bgl{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none;animation:bgIn 1s ease both}
#bgl::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--tr),.15),rgba(var(--tr),.45))}
.app{height:100dvh;display:flex;flex-direction:column;gap:10px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--abg);position:relative;z-index:1;transition:background .6s}
.app.fx{background:transparent}
/* liquid glass */
.top,.card,.center,.promo,.quote,.ibox,.modal,.pop{position:relative;border:1px solid var(--line);background:var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 26px rgba(255,255,255,.035),0 12px 36px rgba(0,0,0,.28)}
.fx .top,.fx .card,.fx .center,.fx .ibox,.modal,.pop{-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
.top::before,.card::before,.ibox::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.05) 35%,rgba(var(--acr),.3) 70%,rgba(255,255,255,.28));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.card:hover,.mc:hover,.chip:hover{background-image:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.1),transparent 70%)}
.top,.card,.center,.promo,.quote,.mc,.ibox,.btn,.ib,.send,.off,.opt,.chip,.nav button,.bub{transition:background-color .6s,border-color .6s,color .4s,box-shadow .4s,transform .25s var(--e)}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;border-radius:16px;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px}.logo img{width:34px;height:34px;border-radius:22%;object-fit:cover}
.brand{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:800;letter-spacing:.5px;white-space:nowrap;pointer-events:none}
.tag{font-size:13px;color:var(--sub)}.sp{flex:1}
.pill,.off{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;background:rgba(var(--acr),.16);font-size:13px;font-weight:600}
.off.on{background:rgba(239,68,68,.2);color:#fca5a5}
.dot{width:8px;height:8px;border-radius:50%;background:#22e58f;box-shadow:0 0 8px #22e58f}
.ib{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--nt)}
.ib:hover{background:rgba(var(--acr),.18);transform:scale(1.1)}.ib:active,.mc:active,.chip:active{transform:scale(.94)}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;border:2px solid rgba(var(--acr),.6)}
.menu-btn{display:none}
.main{flex:1;min-height:0;display:grid;grid-template-columns:240px 1fr 290px;gap:12px}
.side,.right{overflow-x:hidden;display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
.card{border-radius:16px;padding:16px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;font-size:15px;color:var(--nt);text-align:left;border:1px solid transparent}
.nav button:hover{background:rgba(var(--acr),.16)}.nav button:hover svg{transform:translateX(3px)}.nav button svg{transition:transform .25s var(--e)}
.nav button.on{background:linear-gradient(90deg,rgba(var(--acr),.45),rgba(var(--acr),.15));border-color:rgba(var(--acr),.55);color:var(--tx)}
.promo,.quote{overflow:hidden;border-radius:16px;padding:22px 18px;font-weight:600;background:linear-gradient(160deg,rgba(var(--acr),.34),rgba(var(--tr),.9))}
.promo{flex:1;min-height:150px;font-size:17px;display:flex;flex-direction:column}
.promo svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}.promo span{position:relative;z-index:1;color:#fff;text-shadow:0 2px 10px rgba(10,6,40,.8)}
.quote{flex:1;min-height:120px;display:flex;flex-direction:column;justify-content:center;font-size:18px;line-height:1.6}
.h3{font-size:17px;font-weight:700;margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:14px}.row .k{flex:1}.row .v{color:var(--ac);font-weight:600;font-size:13px;filter:brightness(1.4)}
.rc{display:flex;gap:12px;align-items:center;padding:9px 0;width:100%;text-align:left}
.rc small{display:block;color:var(--sub);font-size:12px;margin-top:2px}.rc .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;font-size:14px}
.ico{width:34px;height:34px;border-radius:10px;background:rgba(var(--acr),.16);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--nt)}
.center{min-width:0;min-height:0;display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--cbg)}
.fx .center{background:var(--panel)}
.scroll{overflow-x:hidden;position:relative;flex:1;min-height:0;overflow-y:auto;padding:22px;display:flex;flex-direction:column}
.hero{margin:auto;width:100%;max-width:820px;display:flex;flex-direction:column;gap:22px;padding-bottom:30px}
.hero h1{font-size:clamp(26px,4vw,38px);font-weight:800}.hero p{font-size:clamp(16px,2vw,21px);color:var(--nt);margin-top:6px}
.modes{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.mc{padding:16px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card2);text-align:left;display:flex;flex-direction:column;gap:6px;animation:rise .5s var(--e) both}
.mc:nth-child(2){animation-delay:.06s}.mc:nth-child(3){animation-delay:.12s}.mc:nth-child(4){animation-delay:.18s}.mc:nth-child(5){animation-delay:.24s}.mc:nth-child(6){animation-delay:.3s}
.mc:hover{transform:translateY(-4px) scale(1.02);border-color:rgba(var(--acr),.7)}
.mc.on{border:2px solid var(--ac2);box-shadow:0 0 26px rgba(var(--ac2r),.45);background:rgba(var(--ac2r),.18)}
.mc b{font-size:15px}.mc small{font-size:11px;color:var(--sub)}.mc span{color:var(--ac2)}
.msgs{width:100%;max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;flex-direction:column;gap:3px;max-width:82%;animation:rise .45s var(--e) both}
.msg.u{align-self:flex-end;align-items:flex-end}.msg.a{align-self:flex-start}
.bub{padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word;border:1px solid var(--line)}
.u .bub{background:rgba(var(--acr),.32)}.a .bub{background:var(--card2)}
.bub img{display:block;max-width:100%;border-radius:12px;margin-bottom:8px}.bub a{font-size:12px;color:var(--nt);display:inline-block;margin-bottom:6px}
.acts{display:flex;flex-wrap:wrap;gap:2px;opacity:0;transition:.15s}.msg:hover .acts{opacity:1}@media(hover:none){.acts{opacity:1}}
.acts button{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub);padding:4px 8px;border-radius:7px}.acts button:hover{background:rgba(255,255,255,.08);color:var(--tx)}
@keyframes bn{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
.td{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-right:5px;animation:bn 1.2s infinite}.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}
.inwrap{padding:0 22px 8px;display:flex;flex-direction:column;align-items:center;gap:12px}
.ibox{width:100%;max-width:800px;border-radius:22px;background:var(--ibg);padding:10px 14px;display:flex;flex-direction:column;gap:6px;border-color:rgba(var(--acr),.45)}
.ibox.temp{border-color:#ef4444}.ibox input.t{width:100%;border:none;background:none;font-size:15px;padding:8px 4px}.ibox input.t::placeholder{color:var(--sub)}
.irow{display:flex;align-items:center;gap:4px}.irow .ib{width:32px;height:32px}
.send{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(var(--acr),.55);color:#fff;margin-left:6px}
.send:hover{transform:scale(1.1) rotate(-8deg)}.send:active{transform:scale(.95)}
.try{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--sub)}
.chip{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:18px;border:1px solid var(--line);background:var(--card2);color:var(--nt);font-size:12px}.chip:hover{border-color:rgba(var(--acr),.7)}
.foot{text-align:center;font-size:12px;color:var(--sub);padding:4px 0 10px}
.pop{position:absolute;bottom:calc(100% + 8px);right:0;min-width:190px;background:var(--modal);border-radius:14px;padding:6px;z-index:20;transform-origin:bottom right;animation:pop .25s var(--e) both}
.pop button{display:block;width:100%;text-align:left;padding:9px 10px;border-radius:9px;font-size:14px}.pop button:hover,.pop button.on{background:rgba(var(--acr),.2)}.pop small{display:block;font-size:11px;color:var(--sub)}
.file{font-size:12px;padding:4px 10px;border-radius:8px;background:rgba(var(--acr),.25);display:flex;justify-content:space-between;align-items:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .25s both}
.modal{width:100%;max-width:480px;max-height:85vh;overflow-y:auto;background:var(--modal);border-radius:20px;padding:20px;animation:pop .4s cubic-bezier(.2,1.1,.3,1) both}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:17px;font-weight:700}
.lab{font-size:11px;color:var(--sub);margin:16px 0 6px;font-weight:700;letter-spacing:.5px}
.fld{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:14px}select.fld option{background:var(--modal);color:var(--tx)}
.btn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:rgba(var(--acr),.14);font-size:14px;font-weight:600;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:hover{background:rgba(var(--acr),.28)}.btn.red{color:#fca5a5;border-color:rgba(239,68,68,.4)}
.err{font-size:12px;color:#fca5a5;background:rgba(239,68,68,.1);padding:8px;border-radius:8px;margin-bottom:8px}
.mem{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:13px;line-height:1.4}
.opts{display:flex;gap:8px}.opt{flex:1;padding:12px 6px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--card2)}.opt.on{border:2px solid var(--ac);box-shadow:0 0 14px rgba(var(--acr),.45)}
.ug{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.us{padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.04)}.us.w2{grid-column:span 2}
.us b{display:block;font-size:19px}.us small{font-size:10px;color:var(--sub);font-weight:700;letter-spacing:.4px}
.lnk{font-size:12px;color:var(--sub);margin-top:8px;text-decoration:underline}
.vm{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding:12px;border:1px solid var(--line);border-radius:12px}.vm small{display:block;font-size:11px;color:var(--sub)}
.tg{width:44px;height:26px;border-radius:13px;background:rgba(255,255,255,.16);position:relative;flex-shrink:0;transition:background .3s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.2,1.2,.3,1)}.tg.on{background:var(--ac)}.tg.on::after{transform:translateX(18px)}
.nc{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(var(--acr),.22),transparent 60%),var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:ncFade 1.15s ease both}
.nc::before{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.2),transparent);transform:skewX(-18deg);animation:ncSweep 1s .1s ease-in-out both}
.nc-orb{position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center;animation:ncPop .7s cubic-bezier(.2,1.2,.3,1) both}
.nc-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);opacity:0;animation:ncRing 1.1s ease-out both}.nc-ring:nth-child(2){animation-delay:.18s}.nc-ring:nth-child(3){animation-delay:.36s}
.nc-spin{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,var(--ac) 85%,var(--ac2) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:ncSpin .9s linear infinite}
.nc-core{position:relative;overflow:hidden;width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 34px rgba(var(--ac2r),.65);animation:ncPulse .9s ease-in-out infinite}
.nc-logo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;background:#05060f;animation:ncPlus .7s .15s cubic-bezier(.2,1.3,.3,1) both}
.nc-core svg{animation:ncPlus .7s .15s cubic-bezier(.2,1.3,.3,1) both}
.nc-txt{font-size:15px;font-weight:700;letter-spacing:.5px;color:var(--tx);display:flex;align-items:center;gap:2px;animation:ncUp .5s .15s ease both}
.nc-dots span{display:inline-block;animation:bn 1s infinite}.nc-dots span:nth-child(2){animation-delay:.15s}.nc-dots span:nth-child(3){animation-delay:.3s}
@keyframes ncFade{0%{opacity:0}15%{opacity:1}72%{opacity:1}100%{opacity:0}}@keyframes ncSweep{from{left:-40%}to{left:120%}}
@keyframes ncPop{from{transform:scale(.3) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}@keyframes ncRing{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes ncSpin{to{transform:rotate(360deg)}}@keyframes ncPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes ncPlus{from{transform:rotate(-180deg) scale(.2);opacity:0}to{transform:none;opacity:1}}@keyframes ncUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.enter{animation:rise .65s .55s var(--e) both}.enter .mc{animation:rise .5s var(--e) both}
.enter .mc:nth-child(1){animation-delay:.7s}.enter .mc:nth-child(2){animation-delay:.76s}.enter .mc:nth-child(3){animation-delay:.82s}.enter .mc:nth-child(4){animation-delay:.88s}.enter .mc:nth-child(5){animation-delay:.94s}.enter .mc:nth-child(6){animation-delay:1s}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.95)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes bgIn{from{opacity:0;filter:blur(14px)}to{opacity:1;filter:none}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
@media(max-width:1100px){.main{grid-template-columns:240px 1fr}.right{display:none}}
@media(max-width:768px){.main{grid-template-columns:1fr}.menu-btn{display:flex}.tag,.pill{display:none}
.side{position:fixed;top:0;bottom:0;left:0;width:270px;z-index:90;padding:14px;background:var(--modal);border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .4s var(--e)}.side.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;animation:fade .25s}.modes{grid-template-columns:repeat(3,1fr)}.scroll{padding:14px 12px}.inwrap{padding:0 12px 6px}.msg{max-width:92%}.ug{grid-template-columns:repeat(2,1fr)}.us.w2{grid-column:span 1}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
.promoart{position:absolute;inset:0;z-index:0}.promoart svg{position:absolute;inset:0;width:100%;height:100%}
[data-theme=hacker]{--tr:0,10,0;--panel:rgba(0,10,0,.6);--line:#0a4a0a;--tx:#00ff41;--sub:#00a82b;--ac:#00ff41;--ac2:#00ff41;--acr:0,255,65;--ac2r:0,255,65;--card2:rgba(0,20,0,.7);--ibg:rgba(0,12,0,.9);--modal:#000;--nt:#00e03a;--cbg:transparent;--abg:transparent}
[data-theme=hacker] body{font-family:'Courier New',Courier,monospace}[data-theme=hacker] *{border-radius:0!important}
[data-theme=hacker] .send{background:transparent;border:1px solid #0f0;box-shadow:0 0 10px rgba(0,255,0,.4);color:#0f0}
[data-theme=hacker] .promo,[data-theme=hacker] .quote{background:rgba(0,20,0,.6);color:var(--tx)}[data-theme=hacker] .promoart{opacity:.35;filter:hue-rotate(95deg) saturate(1.4)}
[data-theme=hacker] .mc.on,[data-theme=hacker] .opt.on,[data-theme=hacker] .nav button.on{background:rgba(0,255,0,.12);border-color:#0f0;box-shadow:none}
[data-theme=hacker] .u .bub{background:transparent}[data-theme=hacker] .av{color:#000;background:#0f0;border-color:#0f0}
.promoart *{transition:fill .7s,stop-color .7s}
